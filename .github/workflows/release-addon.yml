name: Release Addon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-addon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_tag="$(git tag --points-at HEAD 'v*' | head -n1 || true)"
          if [[ -n "$current_tag" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=${current_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag -l 'v*' | sort -V | tail -n1 || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$base_version"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          next_version="$major.$minor.$((patch + 1))"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"

      - name: Build addon zip
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          rm -rf dist
          mkdir -p dist/radi_ot
          cp -R addons/radi_ot/* dist/radi_ot/

          (
            cd dist
            zip -r "../radi_ot-v${version}.zip" "radi_ot"
          )

      - name: Publish GitHub release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: radi_ot-v${{ steps.version.outputs.version }}.zip
