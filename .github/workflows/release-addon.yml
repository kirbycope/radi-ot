name: Release Addon

on:
  # Releases are cut only when a pull request is merged into main, never on a direct push.
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-addon-main
  cancel-in-progress: false

jobs:
  release:
    # "closed" also fires on a pull request that was closed without merging.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # A pull_request checkout defaults to the simulated merge ref; the release reads tags from
      # main and pushes back to it, so main itself is what has to be checked out.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_tag="$(git tag --points-at HEAD 'v*' | head -n1 || true)"
          if [[ -n "$current_tag" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=${current_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag -l 'v*' | sort -V | tail -n1 || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$base_version"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          next_version="$major.$minor.$((patch + 1))"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"

      - name: Build addon zip
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          rm -rf dist
          mkdir -p "dist/radi_ot"
          # The addon is the repository root; everything but its own scaffolding goes in the zip.
          rsync -a --exclude '/.git' --exclude '/.github' --exclude '/demo' \
                --exclude '/.gitignore' --exclude '/.gitattributes' ./ "dist/radi_ot/"

          (
            cd dist
            zip -r "../radi_ot-v${version}.zip" "radi_ot"
          )

      - name: Publish GitHub release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: radi_ot-v${{ steps.version.outputs.version }}.zip
