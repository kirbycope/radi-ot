name: GUT Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  gut:
    runs-on: ubuntu-latest

    env:
      HOME: /tmp/godot-home
      XDG_CONFIG_HOME: /tmp/godot-home/.config
      XDG_CACHE_HOME: /tmp/godot-home/.cache

    container:
      image: "barichello/godot-ci:latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Container Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libfontconfig1

      - name: Setup Godot Home Directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME/godot" "$XDG_CACHE_HOME"

      - name: Import project assets
        run: godot --headless --editor --quit --path "$PWD"

      - name: Run GUT Unit Tests
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          mkdir -p test-results
          godot \
            --headless \
            --audio-driver Dummy \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=.gutconfig.json \
            -gjunit_xml_file=test-results/gut-junit.xml \
            -gcompact_mode \
            -gno_error_tracking \
            -gexit

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-reports
          path: test-results/
          if-no-files-found: warn
