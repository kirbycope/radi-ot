name: GUT Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  gut:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.8-dev3/Godot_v4.8-dev3_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo mv /tmp/Godot_v4.8-dev3_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -f /tmp/godot.zip

      - name: Import project assets
        run: godot --headless --path "$PWD" --import --quit

      - name: Run GUT Unit Tests
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          mkdir -p test-results
          godot \
            --headless \
            --audio-driver Dummy \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=.gutconfig.json \
            -gjunit_xml_file=test-results/gut-junit.xml \
            -gcompact_mode \
            -gno_error_tracking \
            -gexit

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-reports
          path: test-results/
          if-no-files-found: warn
