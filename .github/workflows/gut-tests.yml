name: GUT Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  gut:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.0
          use-dotnet: false

      - name: Import project assets
        run: godot --headless --path "$PWD" --import --quit

      - name: Run GUT Unit Tests
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          mkdir -p test-results
          godot \
            --headless \
            --audio-driver Dummy \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=.gutconfig.json \
            -gjunit_xml_file=test-results/gut-junit.xml \
            -gcompact_mode \
            -gexit

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-reports
          path: test-results/
          if-no-files-found: warn
